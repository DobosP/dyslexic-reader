name: dyslexic_reader
description: "Dyslexia-friendly reader: open PDFs and text and re-render them with adjustable spacing, themes, a reading ruler, and read-aloud with word highlighting."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management (compile-safe, testable) — see docs/ARCHITECTURE.md
  flutter_riverpod: ^2.5.1
  # Lightweight persistence for ReadingPrefs
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  scrollable_positioned_list: ^0.3.8
  google_mlkit_text_recognition: ^0.15.1
  # PaddleOCR PP-OCRv5 (ONNX) on-device OCR. ~20 MB model downloads on the first
  # scanned-PDF import, then runs fully offline. Pinned for reproducible builds.
  mobile_ocr:
    git:
      url: https://github.com/ente-io/mobile_ocr
      ref: bd1cce917e914690c00cc138b000b728742dde2b
  # On-device text-to-speech (system voices) for read-aloud.
  flutter_tts: ^4.2.5
  # Word (.docx) import: unzip the archive and parse word/document.xml.
  archive: ^3.6.1
  xml: ^6.5.0
  # Open mailto:/https: links from the About screen (feedback, privacy policy).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
    # OFL license texts, registered with LicenseRegistry (see main.dart) so the
    # bundled fonts appear on the in-app open-source licenses page.
    - assets/fonts/OpenDyslexic-OFL.txt
    - assets/fonts/AtkinsonHyperlegible-OFL.txt
    - assets/fonts/Lexend-OFL.txt

  # Bundled reading fonts. All SIL Open Font License (OFL); license texts live
  # alongside the files in assets/fonts/*-OFL.txt. Spacing matters more than the
  # font itself (see docs/RESEARCH.md), so these are options, not a "fix".
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
        - asset: assets/fonts/OpenDyslexic-Italic.otf
          style: italic
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
